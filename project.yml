name: Netto
options:
  bundleIdPrefix: com.netto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CLANG_ENABLE_MODULES: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Netto:
    type: application
    platform: iOS
    sources:
      - path: Netto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netto.app
        PRODUCT_NAME: Netto
        INFOPLIST_FILE: Netto/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1

  NettoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NettoTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.netto.app.tests
    dependencies:
      - target: Netto

schemes:
  Netto:
    build:
      targets:
        Netto: all
        NettoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NettoTests
    archive:
      config: Release
