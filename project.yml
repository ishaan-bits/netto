name: Netto
options:
  bundleIdPrefix: com.ishaanparimal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CLANG_ENABLE_MODULES: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Netto:
    type: application
    platform: iOS
    sources:
      - path: Netto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanparimal.netto
        PRODUCT_NAME: Netto
        INFOPLIST_FILE: Netto/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Netto/Netto.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: NettoWidget
        embed: true

  # Home screen widget (WidgetKit extension): reads only the shared App Group summary
  # written by Netto/Core/Widget. Shares Theme/NettoColor/NettoLogo and the asset catalog
  # with the app; never links PhotoKit, Vision, or the deletion path.
  NettoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NettoWidget
      - path: Netto/Core/Widget
      - path: Netto/UI/Theme/Theme.swift
      - path: Netto/UI/DesignSystem/NettoColor.swift
      - path: Netto/UI/Brand/NettoLogo.swift
      - path: Netto/Assets.xcassets
      - path: Netto/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanparimal.netto.widget
        PRODUCT_NAME: NettoWidget
        INFOPLIST_FILE: NettoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NettoWidget/NettoWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  NettoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NettoTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanparimal.netto.tests
    dependencies:
      - target: Netto

  # TEMPORARY visual-QA target — removed at the end of the Milestone 3D QA run.
  NettoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NettoUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ishaanparimal.netto.uitests
        TEST_TARGET_NAME: Netto
    dependencies:
      - target: Netto

schemes:
  Netto:
    build:
      targets:
        Netto: all
        NettoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NettoTests
        - NettoUITests
    archive:
      config: Release
